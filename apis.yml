aid: agilesoda
name: AgileSoDA
description: >-
  AgileSoDA (애자일소다) is a Seoul-based enterprise AI software company founded in April 2015, whose
  name combines "Agility" with "Software Defined AI". It builds agentic AI systems that automate and
  optimize complex business decisions for Korean enterprises across insurance, banking, manufacturing
  and the public sector. Its current line is organized around the JT (Just Type) platform — JT Foundry
  for deploying and operating agents, JT Solution, Agentic OCR (ETL with VLM), Agentic RAG, Agentic Ops,
  the insurance-document extractor InsuDoc, Ground Forge for automated data annotation and a vibe-coding
  UI Package — alongside earlier products SparklingSoDA, BakingSoDA (reinforcement-learning decision
  agents), TwinDoc, TwinReader OCR and ModelServant. The company was named a Gartner Cool Vendor in 2024.
  Software is delivered as licensed, customer-deployed enterprise systems rather than a public cloud API:
  AgileSoDA publishes a product documentation portal at docs.agilesoda.ai that includes a ModelServant
  API Guide and per-product Developer's Guides, but every guide sits behind a login, and no public
  OpenAPI, SDK, package or self-service developer program was found.
